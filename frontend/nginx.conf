server {
    listen 5176;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Performance: Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 1. API Reverse Proxy (REST + Server-Sent Events for AI Copilot)
    location /api/ {
        client_max_body_size 25m;
        proxy_pass http://backend:8088/api/;
        proxy_http_version 1.1;

        # WebSocket & protocol upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard forwarded identity
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for live token streaming in AI conversations
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 2. Uploaded Media & Proofs (Avatars, Project PDFs, Certificates)
    location /static/uploads/ {
        proxy_pass http://backend:8088/static/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Backend Health & Documentation Endpoints
    location = /health {
        proxy_pass http://backend:8088/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 4. Vite Immutable Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 5. SPA Routing (Client-side Router Fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}