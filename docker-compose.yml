services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env file}
    volumes:
      - verisphere-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in the root .env file} -d ${POSTGRES_DB:?Set POSTGRES_DB in the root .env file}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - verisphere-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - verisphere-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - verisphere-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8088:8088"
    env_file:
      - ./backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8088
      WORKERS_COUNT: ${WORKERS_COUNT:-1}
      APP_ENV: ${APP_ENV:?Set APP_ENV in the root .env file}
      DEBUG: ${DEBUG:?Set DEBUG in the root .env file}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the root .env file}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - verisphere-data:/app/data
      - verisphere-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verisphere-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5176:5176"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - verisphere-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN:-}
    depends_on:
      - frontend
      - backend
    networks:
      - verisphere-network

networks:
  verisphere-network:
    driver: bridge

volumes:
  verisphere-data:
  verisphere-uploads:
  verisphere-postgres:
  verisphere-redis: