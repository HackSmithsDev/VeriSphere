services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      APP_ENV: ${APP_ENV:-development}
      HOST: 0.0.0.0
      PORT: 8088
      DEBUG: ${DEBUG:-false}
      WORKERS_COUNT: ${WORKERS_COUNT:-1}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/data/verisphere.db}
      SECRET_KEY: ${SECRET_KEY:-development-only-change-this-verisphere-key}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5176,http://127.0.0.1:5176}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - verisphere-data:/app/data
    networks:
      - verisphere-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5176:5176"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - verisphere-network

networks:
  verisphere-network:
    driver: bridge

volumes:
  verisphere-data:
